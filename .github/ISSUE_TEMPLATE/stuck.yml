name: Got stuck
description: The docs or the tool left you unsure what to do next.
labels: [stuck]
body:
  - type: input
    id: where
    attributes:
      label: Where were you?
      placeholder: Docs page or command
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What were you trying to do, and what was unclear?
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Roughly how long were you stuck?
